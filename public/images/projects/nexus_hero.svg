<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1E1035" />
      <stop offset="50%" stop-color="#0E091B" />
      <stop offset="100%" stop-color="#06040A" />
    </radialGradient>
    <radialGradient id="neonOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1635" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#120D22" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>
    <!-- Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="750" fill="url(#bgGlow)" />
  <rect width="1200" height="750" fill="url(#techGrid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="600" cy="220" r="320" fill="url(#neonOrb)" />
  <circle cx="200" cy="400" r="220" fill="url(#neonOrb)" opacity="0.6" />
  <circle cx="1000" cy="300" r="250" fill="url(#neonOrb)" opacity="0.5" />

  <!-- Agency Brand Tag -->
  <g transform="translate(600, 100)" text-anchor="middle">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#1C1430" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.4" />
    <circle cx="-110" cy="0" r="4" fill="#A78BFA" />
    <text x="-95" y="5" fill="#DDD6FE" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="2">INTEGRATE AI INTO YOUR BUSINESS</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(600, 200)" text-anchor="middle">
    <text x="0" y="0" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
      AI That Works While
    </text>
    <text x="0" y="65" fill="#A78BFA" font-family="system-ui, sans-serif" font-size="56" font-weight="900" letter-spacing="-1">
      You Sleep.
    </text>
    <text x="0" y="115" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="18" font-weight="400">
      Custom AI agents, voice receptionists, and automated workflows that save time and drive revenue 24/7.
    </text>
  </g>

  <!-- Interactive 3-Card Architecture Preview -->
  <!-- Card 1: Chatbot -->
  <g transform="translate(140, 390)">
    <rect width="280" height="230" rx="18" fill="url(#cardGrad)" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.3" />
    <rect x="24" y="24" width="44" height="44" rx="12" fill="#8B5CF6" fill-opacity="0.15" />
    <!-- Bot Icon -->
    <rect x="36" y="38" width="20" height="16" rx="3" fill="#A78BFA" />
    <circle cx="41" cy="45" r="2" fill="#0E091B" />
    <circle cx="51" cy="45" r="2" fill="#0E091B" />
    <line x1="46" y1="32" x2="46" y2="38" stroke="#A78BFA" stroke-width="2" />
    <text x="24" y="105" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Autonomous Agents</text>
    <text x="24" y="135" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="13" font-weight="400">
      Context-aware intelligence answering queries and booking qualified leads 24/7.
    </text>
    <rect x="24" y="180" width="100" height="26" rx="6" fill="#8B5CF6" fill-opacity="0.2" />
    <text x="74" y="197" fill="#DDD6FE" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">ACTIVE 24/7</text>
  </g>

  <!-- Card 2: Voice Agents -->
  <g transform="translate(460, 370)">
    <!-- Highlighted Center Card -->
    <rect width="280" height="250" rx="18" fill="url(#cardGrad)" stroke="#A78BFA" stroke-width="1.5" stroke-opacity="0.6" filter="drop-shadow(0 20px 30px rgba(139,92,246,0.2))" />
    <rect x="24" y="24" width="44" height="44" rx="12" fill="#8B5CF6" fill-opacity="0.25" />
    <!-- Mic / Voice Wave Icon -->
    <rect x="42" y="34" width="8" height="16" rx="4" fill="#DDD6FE" />
    <path d="M 37 42 C 37 49, 55 49, 55 42" fill="none" stroke="#DDD6FE" stroke-width="2" />
    <line x1="46" y1="49" x2="46" y2="55" stroke="#DDD6FE" stroke-width="2" />
    <text x="24" y="105" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">AI Voice Receptionists</text>
    <text x="24" y="135" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="13" font-weight="400">
      Human-grade voice synthesis scheduling appointments with zero hold time.
    </text>
    <!-- Quantifiable Stat Banner -->
    <rect x="24" y="185" width="232" height="42" rx="10" fill="#0D0818" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.4" />
    <text x="40" y="211" fill="#A78BFA" font-family="system-ui, sans-serif" font-size="16" font-weight="800">85%</text>
    <text x="85" y="210" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="11">Time Saved on Support</text>
  </g>

  <!-- Card 3: Workflows -->
  <g transform="translate(780, 390)">
    <rect width="280" height="230" rx="18" fill="url(#cardGrad)" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.3" />
    <rect x="24" y="24" width="44" height="44" rx="12" fill="#8B5CF6" fill-opacity="0.15" />
    <!-- Workflow Icon -->
    <rect x="35" y="36" width="10" height="10" rx="2" fill="#A78BFA" />
    <rect x="49" y="48" width="10" height="10" rx="2" fill="#A78BFA" />
    <path d="M 40 46 L 40 53 L 49 53" fill="none" stroke="#A78BFA" stroke-width="2" />
    <text x="24" y="105" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Workflow Automation</text>
    <text x="24" y="135" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="13" font-weight="400">
      End-to-end CRM synchronization, lead routing, and instant WhatsApp notifications.
    </text>
    <rect x="24" y="180" width="115" height="26" rx="6" fill="#8B5CF6" fill-opacity="0.2" />
    <text x="81" y="197" fill="#DDD6FE" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">ZERO LATENCY</text>
  </g>

  <!-- Bottom Proof Bar -->
  <g transform="translate(600, 690)" text-anchor="middle">
    <text x="0" y="0" fill="#6B7280" font-family="system-ui, sans-serif" font-size="13" font-weight="500">
      3x Lead Conversion  •  60% Cost Reduction  •  Sub-Second Response Times
    </text>
  </g>
</svg>
